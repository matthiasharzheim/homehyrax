name: Website

# Veroeffentlicht site/public auf GitHub Pages (homehyrax.com, deutsch unter /de/).
# Laeuft nur in oeffentlichen Repos – im privaten Arbeits-Repo gibt es keine Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public
      - id: deployment
        uses: actions/deploy-pages@v5
