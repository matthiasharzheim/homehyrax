name: Android App

# Dieselbe Datei liegt im privaten Arbeits-Repo und im oeffentlichen Spiegel (oeffentlich_spiegeln.py).
#   Oeffentliches Repo: baut bei Push auf main und auf Pruef-Branches (pruefung/*), bei PRs und von Hand
#                       (oeffentliche Repos kosten weder Actions-Minuten noch -Speicher); Push auf main baut
#                       zusaetzlich das Store-Bundle und laedt es in den internen Test (Job "play", Umgebung "play")
#   Privates Repo:      baut nur von Hand (Actions-Minuten und -Speicher des Kontos sind knapp), Artefakte 1 Tag
#
# Einstellungen je Repo:
#   Variable VERSION_OFFSET        Versatz fuer versionCode (Standard 100, muss ueber allen verteilten Builds liegen)
#   Secrets SIDELOAD_KEYSTORE_B64 + SIDELOAD_KEYSTORE_PASSWORD (+ SIDELOAD_KEY_ALIAS, SIDELOAD_KEY_PASSWORD)
#                                  signieren die APK; ohne sie ist die Release-APK unsigniert
#   Umgebung "play" (nur Branch main zugelassen) mit den Secrets UPLOAD_KEYSTORE_B64, UPLOAD_KEYSTORE_PASSWORD,
#                                  UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD und PLAY_SERVICE_ACCOUNT_JSON
# Secrets bekommen PRs aus Forks nie; Upload-Schluessel und Dienstkonto braucht nur der Job "play" auf main,
# das signierte Bundle wird nie als Artefakt abgelegt. Fehlgeschlagener Upload: "Re-run jobs" (bleibt ein push).

# Reine Webseiten- und Doku-Aenderungen (site/, docs/, intern/, *.md) bauen keine App
on:
  push:
    branches: [main, "pruefung/**"]
    paths-ignore: ["site/**", ".github/workflows/pages.yml", "docs/**", "intern/**", "**/*.md"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/pages.yml", "docs/**", "intern/**", "**/*.md"]
  workflow_dispatch:

# Ein neuer Push auf denselben PR/Pruef-Branch bricht den laufenden Build ab; Laeufe auf main laufen zu Ende
# (jeder Stand auf main geht in den internen Test von Google Play)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Nur lesen: der Lauf baut und laedt Artefakte hoch, schreibt nichts ins Repo
permissions:
  contents: read

env:
  VERSION_OFFSET: ${{ vars.VERSION_OFFSET || '100' }}

jobs:
  apk:
    # privates Repo: nur von Hand gestartet
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      HAS_SIDELOAD_KEY: ${{ secrets.SIDELOAD_KEYSTORE_B64 != '' }}
      # Artefakte im privaten Repo nur 1 Tag (Speicher-Kontingent des Kontos), im oeffentlichen 14 Tage
      KEEP_DAYS: ${{ github.event.repository.private && '1' || '14' }}
    steps:
      - uses: actions/checkout@v7

      # gradle-wrapper.jar muss ein offizielles Gradle-Release sein
      - uses: gradle/actions/wrapper-validation@v6

      # Die WireGuard-Bibliothek (Go-Tests + gomobile, ~5-7 min) nur neu bauen, wenn sich der Go-Kern
      # oder sein Bauweg geaendert hat; sonst AAR und Go-Lizenzliste aus dem Cache. Die Ziele sind Teil
      # des Schluessels, weil der Handstart zusaetzlich x86_64 baut.
      - name: WireGuard-Bibliothek aus dem Cache
        id: aar
        uses: actions/cache@v4
        with:
          path: |
            app/libs/wgbridge.aar
            app/src/main/assets/licenses_go.txt
          key: wgbridge-${{ github.event_name == 'workflow_dispatch' && 'arm64-arm-amd64' || 'arm64-arm' }}-${{ hashFiles('wgbridge/**', 'build-go.sh', 'tools/licenses.py') }}

      - uses: actions/setup-go@v7
        if: steps.aar.outputs.cache-hit != 'true'
        with:
          go-version-file: wgbridge/go.mod
          cache-dependency-path: wgbridge/go.sum

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle   # Gradle-Abhaengigkeiten zwischen Laeufen behalten (~1-2 min)

      # Android-SDK ist auf ubuntu-latest vorinstalliert ($ANDROID_HOME);
      # android-actions/setup-android scheitert am veralteten Paket "tools".
      - name: SDK + NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null

      # Englisch/Deutsch vollstaendig und mit gleichen Platzhaltern (sonst zeigt die App Schluessel statt Text)
      - name: Uebersetzungen pruefen
        run: python3 tools/check_strings.py

      # Von Hand gestartet: zusaetzlich x86_64 fuer den Android-Emulator; ARM-Uebersetzung
      # im Emulator reicht fuer den Go-Kern nicht (SIGILL)
      - name: WireGuard-Bibliothek (Go-Tests + gomobile)
        if: steps.aar.outputs.cache-hit != 'true'
        env:
          GOMOBILE_TARGETS: ${{ github.event_name == 'workflow_dispatch' && 'android/arm64,android/arm,android/amd64' || 'android/arm64,android/arm' }}
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" ./build-go.sh

      # Sideload-Signatur nur, wenn das Secret existiert (Secrets fehlen bei PRs aus Forks)
      - name: Sideload-Schluessel
        if: env.HAS_SIDELOAD_KEY == 'true'
        env:
          SIDELOAD_KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_B64 }}
        run: |
          echo "$SIDELOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
          echo "SIDELOAD_KEYSTORE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"

      # Nur 64-Bit: APK ~24 MB statt ~45 MB, alle aktuellen Handys sind 64-Bit
      # Lint auch bei PRs (~1-2 min mehr): sonst fallen Lint-Fehler erst nach dem Merge auf main auf
      - name: APK bauen (inkl. Lint)
        env:
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
          SIDELOAD_KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
          SIDELOAD_KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
        run: ./gradlew lintRelease assembleRelease -Pabis=arm64-v8a --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: HomeHyrax-apk
          # app-release.apk (signiert) oder app-release-unsigned.apk
          path: app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error
          retention-days: ${{ env.KEEP_DAYS }}

      - name: Emulator-APK (x86_64, nur von Hand gestartet)
        if: github.event_name == 'workflow_dispatch'
        env:
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
          SIDELOAD_KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
          SIDELOAD_KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
        run: |
          rm -f app/build/outputs/apk/release/app-release*.apk
          ./gradlew assembleRelease -Pabis=x86_64 --console=plain
          apk=$(ls app/build/outputs/apk/release/app-release*.apk | head -n 1)
          mv "$apk" "$(basename "$apk" .apk)-x86_64.apk"

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: HomeHyrax-apk-x86_64
          path: app-release*-x86_64.apk
          if-no-files-found: error
          retention-days: ${{ env.KEEP_DAYS }}

      - name: Schluessel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/sideload.jks"

  # Jeder Stand auf main des oeffentlichen Repos geht automatisch in den internen Test von Google Play;
  # Tester bekommen ihn als normales Update. Produktion bleibt Handarbeit in der Play Console.
  # Eigener Job in der Umgebung "play": nur dort liegen Upload-Schluessel und Dienstkonto, und die Umgebung
  # laesst nur main zu. Gleicher Lauf = gleiche versionCode wie die APK; Bibliothek aus dem Cache des Build-Jobs.
  play:
    needs: apk
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: play
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_B64 != '' }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Ohne Upload-Schluessel oder Dienstkonto kein Upload
        if: env.HAS_UPLOAD_KEY != 'true' || env.HAS_PLAY_ACCOUNT != 'true'
        run: echo "::warning::Umgebung 'play' unvollstaendig (Upload-Schluessel/Dienstkonto) – kein Upload in den internen Test"

      - uses: actions/checkout@v7
        if: env.HAS_UPLOAD_KEY == 'true' && env.HAS_PLAY_ACCOUNT == 'true'

      - name: WireGuard-Bibliothek aus dem Cache des Build-Jobs
        if: env.HAS_UPLOAD_KEY == 'true' && env.HAS_PLAY_ACCOUNT == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            app/libs/wgbridge.aar
            app/src/main/assets/licenses_go.txt
          # gleicher Schluessel wie im Build-Job (dort ohne Handstart immer arm64-arm)
          key: wgbridge-arm64-arm-${{ hashFiles('wgbridge/**', 'build-go.sh', 'tools/licenses.py') }}
          fail-on-cache-miss: true

      - uses: actions/setup-java@v6
        if: env.HAS_UPLOAD_KEY == 'true' && env.HAS_PLAY_ACCOUNT == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # NDK auch hier: Gradle entfernt damit die Debug-Symbole aus den .so im Bundle (wie im Build-Job)
      - name: SDK + NDK
        if: env.HAS_UPLOAD_KEY == 'true' && env.HAS_PLAY_ACCOUNT == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null

      - name: Store-Bundle (AAB, mit Upload-Schluessel)
        if: env.HAS_UPLOAD_KEY == 'true' && env.HAS_PLAY_ACCOUNT == 'true'
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease --console=plain
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Schluessel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Google Play, interner Test
        if: env.HAS_UPLOAD_KEY == 'true' && env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.camperflower.homehyrax
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed
